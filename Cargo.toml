[workspace]
members = ["crates/engine", "crates/math", "crates/mesh", "crates/renderer", "crates/scripting", "crates/debug_ui", "examples/primitives", "examples/lighting", "examples/genos"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.30"
png = "0.17"
pollster = "0.4"
rhai = "1.23"
wgpu = "30.0.1"
winit = "0.30.13"
