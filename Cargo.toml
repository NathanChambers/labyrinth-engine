[workspace]
members = ["crates/engine", "crates/math", "crates/mesh", "crates/renderer", "examples/primitives"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.30"
pollster = "0.4"
wgpu = "30.0.1"
winit = "0.30.13"
